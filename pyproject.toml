[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-plasma-monitor"
version = "0.3.0"
description = "Local collector API for the Home-lab Monitor Plasma widget"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Biel" }]
dependencies = [
    "flask>=3.1,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0,<7",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.25,<5",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "trustme>=1.2,<2",
]

[project.scripts]
homelab-monitor = "homelab_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["collector/src/homelab_monitor"]

[tool.pytest.ini_options]
testpaths = ["collector/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
